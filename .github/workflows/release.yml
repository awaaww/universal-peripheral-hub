name: Release

# Builds the per-user NSIS installer on a tag. The artifact is unsigned: the
# workflow uploads it as a build artifact and deliberately does not create a
# GitHub release until code signing is in place.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build panel frontend
        working-directory: ui
        run: |
          npm ci
          npm run build

      - name: Build core and adapter helpers
        run: |
          cargo build --release -p hubd
          cargo build --release -p adapter-atk
          cargo build --release -p adapter-via

      - name: Stage sidecars for the installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ui/src-tauri/bin | Out-Null
          Copy-Item target/release/hubd.exe ui/src-tauri/bin/
          Copy-Item target/release/atk-adapter.exe ui/src-tauri/bin/
          Copy-Item target/release/via-adapter.exe ui/src-tauri/bin/

      - name: Build the installer
        working-directory: ui
        run: npx tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: universal-peripheral-hub-installer
          path: target/release/bundle/nsis/*.exe
